# Cada push a main publica en https://preview.optimyzejersey.pages.dev.
# La rama principal de Pages solo se publica con una ejecución manual en modo producción.
# Necesita dos secretos en el repositorio: CLOUDFLARE_API_TOKEN (permiso «Cloudflare Pages: Edit»)
# y CLOUDFLARE_ACCOUNT_ID.
name: Desplegar en Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      produccion:
        description: Publicar en producción tras la comprobación estricta
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desplegar-${{ inputs.produccion == true && 'produccion' || 'preview' }}
  cancel-in-progress: true

jobs:
  desplegar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: 1
      WRANGLER_SEND_METRICS: false
      # Solo un sí/no a nivel de trabajo: los valores de los secretos llegan únicamente al paso que publica.
      HAY_SECRETOS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
        env:
          PUBLIC_URL_VISTA_PREVIA: ${{ inputs.produccion != true && 'https://preview.optimyzejersey.pages.dev' || '' }}
      - run: pnpm check:release
      - name: Comprobar requisitos de producción
        if: github.event_name == 'workflow_dispatch' && inputs.produccion == true
        run: pnpm check:release --strict
      # Sin los secretos, las comprobaciones corren igual y solo se salta la publicación (sin fallo ni correo).
      - name: Avisar si faltan los secretos de Cloudflare
        if: env.HAY_SECRETOS_CF != 'true'
        run: echo "::warning::Faltan los secretos CLOUDFLARE_API_TOKEN o CLOUDFLARE_ACCOUNT_ID. No se publica en Cloudflare Pages."
      - name: Publicar en Cloudflare Pages
        if: env.HAY_SECRETOS_CF == 'true'
        run: pnpm exec wrangler pages deploy dist --project-name optimyzejersey --branch "$RAMA_PAGES"
        env:
          RAMA_PAGES: ${{ github.event_name == 'workflow_dispatch' && inputs.produccion == true && 'main' || 'preview' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
