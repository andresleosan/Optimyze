# Cada push a main comprueba, compila y publica en Cloudflare Pages (https://optimyzejersey.pages.dev).
# Necesita dos secretos en el repositorio: CLOUDFLARE_API_TOKEN (permiso «Cloudflare Pages: Edit»)
# y CLOUDFLARE_ACCOUNT_ID.
name: Desplegar en Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desplegar
  cancel-in-progress: true

jobs:
  desplegar:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: 1
      WRANGLER_SEND_METRICS: false
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:release
      # Sin los secretos, las comprobaciones corren igual y solo se salta la publicación (sin fallo ni correo).
      - name: Avisar si faltan los secretos de Cloudflare
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::warning::Faltan los secretos CLOUDFLARE_API_TOKEN o CLOUDFLARE_ACCOUNT_ID: no se publica en Cloudflare Pages."
      - name: Publicar en Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: pnpm exec wrangler pages deploy dist --project-name optimyzejersey --branch main
